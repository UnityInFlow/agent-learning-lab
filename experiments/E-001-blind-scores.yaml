# E-001 step 2 — your scores, recorded BEFORE reading any scorer output.
#
# Scoring your own work twice measures your consistency, not the rubric's. The gap between
# this sheet and the scorer's is the measurement, and it only means something if this sheet
# was written first. Commit it before running opencode-score.sh, and check the timestamp.
#
# 0-2 per category. `null` is a legitimate entry and you should use it: if you cannot cite
# path:line for a cell, the anchor is undecidable for you too, and that is a finding about
# the rubric rather than about the fixture.
#
# Each variant differs from known-good on exactly ONE dimension. Do not let that tell you
# what to score — if you cannot see the difference from the source alone, record what you
# actually see. A sheet that reproduces benchmarks#10's table is a sheet that read the table.
#
# FIVE ROWS, NOT SIX. known-good is the BASELINE, attached to every scorer run since Decision
# B was built on 2026-08-27 — it is your evidence too, not a sixth sheet to fill. Read each
# variant against it the way the scorer does. It left the scored population because two of its
# four cells were structural nulls (no test file; nothing to compare change-focus against) and
# the other two would have been the only cells produced from a one-tree evidence set.
# 4 categories x 5 variants = 20 cells.

