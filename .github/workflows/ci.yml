# This repository's artifacts are prose, shell tools and YAML contracts, so CI checks those
# rather than compiling anything.
#
# Link rot is the real risk. During the 2026-08-09 verification, 7 of 43 sources redirected,
# including the entire Codex documentation host. A curriculum whose "verified reading" list
# 404s has quietly stopped being verified, and nobody notices until a cohort hits it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Vendor agent docs move constantly. Weekly, so rot is found before a cohort finds it.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check every tool
        run: for f in tools/*.sh .claude/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./tools
          severity: warning
      - name: ShellCheck the hooks
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./.claude/hooks
          severity: warning
      # opencode, git and the reviewer are all stubbed — no network, no tokens, no model
      # calls. A hook that silently does nothing is worse than no hook, so the cases
      # asserting the reviewer was NOT called run here too.
      - name: The review hook behaves
        run: ./.claude/hooks/opencode-review.test.sh

  yaml:
    name: contracts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      # A rubric or run-record template that does not parse is a contract nobody can apply.
      - name: Parse every YAML contract
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('templates/*.yaml') + glob.glob('benchmark/rubrics/*.yaml') + glob.glob('.opencode/fixtures/*.yaml'):
              try:
                  yaml.safe_load(open(f))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          sys.exit(bad)
          PY

  run-record:
    name: a bare token count is rejected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      # The template holding the provenance shape is Layer 3 on its own. This job is what
      # makes it Layer 2, and the fixtures are what prove the job still rejects anything.
      - name: Every fixture produces its registered exit code
        run: ./tools/verify-run-record-validator.sh

  score-output:
    name: a run that found something is not discarded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The scorer producing no sheet is E-001's most informative possible result. Until
      # 2026-08-27 the harness gave it the same exit code as a crash, and the experiment's
      # Exclusions then said to re-run it as infrastructure. This job is what keeps the
      # five outcomes distinguishable across all three agents; the fixtures are what prove
      # it still tells them apart.
      - name: Every model-output fixture produces its registered class
        run: ./tools/verify-model-output-classifier.sh

  sheet-categories:
    name: a sheet missing a category is rejected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A sheet carrying three of the rubric's four categories used to pass everything: the
      # JSON schema said minItems 1 with no maxItems, and the classifier only asks whether a
      # `categories:` key exists. A missing cell is not a null cell, and E-001's dependent
      # variable is a ratio whose denominator is the cell count. This job is what keeps
      # check-sheet-categories.sh discriminating; the cases are what prove it.
      - name: The category-set check still rejects a short sheet
        run: ./tools/verify-sheet-category-checker.sh

  run-gate:
    name: a gate-failing run is not scored
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Decision D admits a B2 run on the evaluator's recorded verdict instead of a fixture
      # name. The invariant it protects — only gate-passing submissions get scored — is worth
      # exactly as much as this check's willingness to refuse. A version that stopped refusing
      # would look identical in every passing run.
      - name: The run-gate check still refuses
        run: ./tools/verify-run-gate-checker.sh

  links:
    name: verified reading is still verified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory on PRs — a vendor moving a doc is not the contributor's fault and must not
    # block their change. It still fails the scheduled run, which is where rot gets noticed.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check every source link
        run: ./tools/check-links.sh
