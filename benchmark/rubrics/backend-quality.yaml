# BE-003 backend quality rubric — B1
#
# PROVENANCE. Drafted by Claude (Opus 5) on 2026-08-25, and the predictions registered
# against it were also Claude's, adopted rather than independently derived. Record that
# when reading the result: a rubric scored against its own author's predictions is a
# weaker claim than one scored against yours. It measures whether the anchors hold, not
# whether your intuitions about them did.
#
# KNOWN OPEN DEFECT. Several anchors below cite evaluator exit codes and named test suites.
# The scoring model receives only the changed source files — it cannot run tests, read a
# diff, or see evaluator output — so those anchors are UNDECIDABLE by it and it emits
# nothing rather than guessing. functional-correctness (all three), requirement-completeness
# (anchor 2) and change-focus (all three) are affected, and the fixtures contain no test
# files at all, which makes test-quality undecidable too. The design rule below conflated
# "backed by something executable" with "decidable by the scorer"; those are not the same
# thing. Unresolved pending a decision on whether to split evaluator-derived categories out
# of the LLM-scored ones. Do not read a score from this file until that is settled.
#
# DESIGN RULE. evaluator.sh already decides pass/fail — build (F04), existing tests (F05),
# functional suite (F03), contract suite (F02), dependency guard (F07), changed files.
# Those are GATES. This rubric must not re-ask their question. It scores how well the work
# was done *among submissions that passed*, and every anchor it can is derived from an exit
# code, a named acceptance test, or a class that exists in the codebase — because an anchor
# backed by something executable cannot be argued into a different score.
#
# A run that fails a gate is unsuccessful even when it used fewer tokens. Do not compute a
# score for it to rank it against passing runs.
#
# SCORING. 0-2 per category, weighted, normalised to 0-100:
#     score = 100 * sum(w_i * s_i) / (2 * sum(w_i))   over categories where s_i is not null
# Categories scoring null are excluded from BOTH sums. A total computed over fewer than
# five categories is not reportable — say which nulled instead.

version: 1
task: BE-003-confirm-shipment
scale: [0, 1, 2]

categories:

  - name: functional-correctness
    weight: 25
    # The evaluator splits its suite in two precisely because a submission can be right and
    # still be wrong: ResponseStatusException returns the correct status through Spring's
    # default body. That split is the anchor — three states, not a binary.
    anchors:
      0: "The functional suite (BE003FunctionalTest) fails — evaluator exit 12 / F03. Behaviour is wrong regardless of how it is reported."
      1: "BE003FunctionalTest passes but BE003ContractTest fails — evaluator exit 13 / F02. Right status, wrong envelope: typically ResponseStatusException or a ResponseEntity assembled in the controller."
      2: "Both BE003FunctionalTest and BE003ContractTest pass — evaluator exit 0 on those suites."

  - name: requirement-completeness
    weight: 20
    # The ticket names four behaviours. They are individually testable, so completeness is
    # a count of named tests, not an impression.
    anchors:
      0: "Two or more of the four ticket behaviours are unimplemented or wrong: CREATED->CONFIRMED, idempotent repeat, CANCELLED->409, unknown id->404."
      1: "Exactly one of the four is wrong. Most commonly the repeat: `confirming twice is idempotent` fails because 409 was chosen for a retry, which the ticket forbids in bold."
      2: "All six functional tests pass, including `the confirmed status is persisted, not just returned` and `confirming does not duplicate or lose the shipment` — persistence and collection integrity, not only the returned body."

  - name: architecture-consistency
    weight: 15
    # The convention is declared in api/ApiExceptions.kt: a sealed ApiException hierarchy,
    # thrown by the caller, rendered once by GlobalExceptionHandler.
    anchors:
      0: "The controller assembles an error body itself (constructs ResponseEntity<ApiError> or a map), or lets Spring's default error shape escape. `error responses do not fall back to the framework default shape` fails."
      1: "Refusals throw, but not through the existing hierarchy — a bare ResponseStatusException, or a new exception type that GlobalExceptionHandler does not already handle."
      2: "Every refusal throws an existing ApiException subclass (ResourceNotFoundException for 404, ConflictException for 409) and no response body is constructed in the shipment package."

  - name: test-quality
    weight: 15
    # The evaluator runs tests but does not grade them. These anchors grade what the
    # submission's own tests assert, not whether they pass.
    anchors:
      0: "No test was added for the new endpoint, or the added tests assert only HTTP status codes."
      1: "Tests cover the happy path and at least one refusal, but idempotency is not exercised by calling confirm twice and comparing the two responses."
      2: "Tests exercise the repeat explicitly (two calls, both asserted), assert on the error envelope body and not only the status, and at least one asserts persisted state by re-reading the shipment rather than trusting the returned object."

  - name: error-handling
    weight: 10
    # CORRECTED 2026-08-25. The first draft asserted SHIPMENT_NOT_CONFIRMABLE already existed
    # and penalised adding it. It does not exist in the base service — the base enum is
    # ORDER_NOT_FOUND, ORDER_ALREADY_EXISTS, SHIPMENT_NOT_FOUND, SHIPMENT_ALREADY_EXISTS,
    # VALIDATION_FAILED — and evaluator.sh says adding one is "the intended solution rather
    # than a scope violation". The draft had read the enum out of the known-good FIXTURE and
    # mistaken the solution for the starting state, so the rubric scored the reference
    # solution down for doing the right thing. Anchors inverted to match the baseline.
    anchors:
      0: "A refusal carries a semantically wrong ErrorCode, or VALIDATION_FAILED is used as a catch-all for a state conflict."
      1: "An existing code is reused for the unconfirmable state because it was the closest available — SHIPMENT_ALREADY_EXISTS or SHIPMENT_NOT_FOUND standing in for 'cannot confirm from this state' — rather than adding the code the situation needs."
      2: "A dedicated code for the unconfirmable state was added to the ErrorCode enum (the reference names it SHIPMENT_NOT_CONFIRMABLE), and the existing SHIPMENT_NOT_FOUND is used for the 404."

  - name: maintainability
    weight: 10
    # No evaluator signal exists here. These anchors are an honest attempt at observables
    # rather than adjectives; if the scorer still returns null, that is the finding this
    # category was included to produce, not a defect to paper over.
    anchors:
      0: "The status transition is expressed as nested if/else on status with no single place showing which transitions are legal, or the confirm logic is duplicated across methods."
      1: "The transition is in one place but undocumented — a reader must infer from the code which states are confirmable."
      2: "Legal transitions are expressed once, exhaustively (a `when` over ShipmentStatus, or an explicit guard naming each refused state), and the non-obvious decision — that a repeat is a success and not a conflict — carries a comment or KDoc saying why."

  - name: change-focus
    weight: 5
    # Fully mechanical: the evaluator already computes CHANGED_FILES and the dependency set.
    # CORRECTED 2026-08-25: the first draft treated any edit to api/ as out of scope, which
    # double-penalised the reference solution alongside error-handling for a single act. The
    # allowed set is shipment/ AND api/, per ALLOWED_PRODUCTION_PREFIXES in evaluator.sh.
    anchors:
      0: "A new Maven dependency appears (exit 20 / F07), or production files outside the allowed prefixes changed (exit 21). evaluator.sh defines allowed as shipment/ AND api/ — editing api/ is in scope, not a violation."
      1: "Nothing outside the allowed prefixes, but the change includes edits the ticket did not ask for — reformatting, renames, or refactors unrelated to confirm."
      2: "The diff contains only what the ticket requires: the shipment feature plus tests. No reformatting of untouched lines."
