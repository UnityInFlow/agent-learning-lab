# BE-003 backend quality rubric — B1, four categories
#
# Replaces the seven-category draft (sha 21aa658d030d), which is kept in git history as a
# worked example of two specific mistakes rather than as a draft to finish. lab#21.
#
# PROVENANCE. Drafted by Claude (Opus 5) on 2026-08-27 from the fixture sources and the
# baseline, at the user's request. The anchors below have never been applied to anything.
# The predictions registered against the previous rubric were also Claude's, adopted rather
# than independently derived, and the one that broke did so on an authoring error nobody
# caught. E-001's predictions are deliberately the user's for that reason. Read any result
# from this file with the drafting provenance in view.
#
# ── WHY THE PREVIOUS ONE DIED ────────────────────────────────────────────────────────────
#
# 1. Anchors cited evaluator exit codes and named test suites. The scorer receives changed
#    source files and nothing else — no test runner, no evaluator output — so those anchors
#    were UNDECIDABLE by it and it emitted nothing rather than guessing.
# 2. Worse: this rubric only ever scores submissions that ALREADY PASSED every gate. Any
#    anchor restating a gate is therefore a constant across the whole population it is
#    allowed to score. `functional-correctness` (25) and `requirement-completeness` (20)
#    did exactly that. Sixty percent of the weight carried no information, and it looked
#    like agreement rather than like a defect.
#
# Both are dropped. The gates own correctness and completeness, and they own them at Layer
# 2 — `evaluator.sh` executes. This file scores how well the work was done AMONG passing
# submissions, which is the only question left once the gates have spoken.
#
# ── THE DESIGN RULE, AND THE TEST FOR ANY FUTURE ANCHOR ──────────────────────────────────
#
# Could a scorer cite `path:line` for it, from the attached files alone? The attachments
# are every *.kt under the fixture, plus the `known-good` baseline tree (E-001 Decision B).
# Nothing else exists: no diff, no test run, no evaluator output, no network.
#
# An anchor must also name a CONSTRUCT — `when` versus an if-chain, an `ApiError` literal,
# a second `post(...)` call — and never "differs from the baseline". With the baseline in
# the evidence set, "differs" is answerable without reading the rubric at all, and a rubric
# that rewards it is measuring spot-the-difference. E-001's KEEP condition requires the
# cited construct for exactly this reason.
#
# ── SCORING ──────────────────────────────────────────────────────────────────────────────
#
#     score = 100 * sum(w_i * s_i) / (2 * sum(w_i))   over categories where s_i is not null
#
# Categories scoring null are excluded from BOTH sums. That keeps a null from reading as a
# zero — but it also means a total over three categories is NOT COMPARABLE to a total over
# four: the same 100 is a different claim. Report the categories that nulled beside every
# total, or do not report the total.
#
# KNOWN AND REGISTERED, NOT A SURPRISE TO BE DISCOVERED LATER. `test-quality` carries 25 of
# the 100 and is decidable on only two of the five gate-passing variants, because the other
# three submitted no test file at all. Three of E-001's twenty cells are null before an
# anchor is read. That is not the previous rubric's defect — a structural null is honest
# where a constant was not — but it is the same family, and it is the open question this
# file hands forward: either the fixture set grows tests, or the weight is wrong.
#
# ── A RUN THAT FAILED A GATE IS UNSUCCESSFUL ─────────────────────────────────────────────
#
# Even when it used fewer tokens. Do not compute a score for it in order to rank it against
# passing runs. This is the single most important rule in the business case.

version: 2
task: BE-003-confirm-shipment
scale: [0, 1, 2]

categories:

  - name: architecture-consistency
    weight: 35
    # The convention is DECLARED IN THE SOURCE, which is what makes it citable: ApiError.kt
    # states "Responses are produced centrally by [GlobalExceptionHandler]; controllers
    # throw an [ApiException] rather than assembling bodies themselves." The scorer can
    # read that sentence and then check the controller against it.
    precondition: none
    anchors:
      0: "The shipment package constructs an error body itself — an `ApiError(...)` or `ApiErrorBody(...)` literal, or a map, appears inside a controller method. A `ResponseEntity<Any>` return type is the usual tell: it exists to carry both the success shape and a hand-built error shape. Cite the literal."
      1: "Refusals throw rather than assemble, but not through the declared hierarchy — a bare `ResponseStatusException`, or a new exception type that is not imported from `com.unityinflow.sample.api`. Cite the throw site and the import list."
      2: "Every refusal throws an existing `ApiException` subclass imported from `com.unityinflow.sample.api` — `ResourceNotFoundException` for a missing shipment, `ConflictException` for a state refusal — and no `ApiError` or `ApiErrorBody` is constructed anywhere in the shipment package. Cite each throw site."

  - name: maintainability
    weight: 25
    # `ShipmentStatus` is an enum, so an exhaustive `when` with no `else` makes adding a
    # state a COMPILE ERROR at this site. An if-chain, or a `when` with `else`, silently
    # routes the new state down the fallback path. That difference is visible in the
    # source and needs no test run to see.
    precondition: none
    anchors:
      0: "The status decision is an `if` / `else if` / `else` chain, or a `when` carrying an `else` branch. Either way a new `ShipmentStatus` constant compiles without touching this method and takes the fallback path unannounced. Cite the chain or the `else`."
      1: "An exhaustive `when` on the status, but the decision is split across more than one construct, or a branch repeats logic another branch already performs. Cite both places."
      2: "One exhaustive `when (shipment.status)`, a branch per enum constant, no `else` — so a new constant is a compile error here. Cite the `when` and count the branches against `ShipmentStatus`."

  - name: test-quality
    weight: 25
    # DECISION A, E-001, 2026-08-27. No test file means `null`, never `0`. A `0` asserts the
    # tests are bad; no tests were submitted, and those are different claims. This
    # precondition is YAML read by a model — Layer 3 — so nothing executes to reject a `0`
    # here. The three predicted nulls are predicted, not guaranteed.
    precondition: "No file under src/test/ among the attachments → score: null, reason: no test file submitted. Never 0."
    anchors:
      0: "Every assertion is a status code. No assertion reads a response body, and no assertion re-reads state through a second request. Cite the assertion list."
      1: "At least one assertion reads a response body, but one of the two behaviours the ticket names in bold is missing: the repeat is not exercised by a SECOND call to confirm, or the persisted state is never re-read through a separate request. Cite what is asserted and name which is absent."
      2: "All three hold, each citable: confirm is called twice and the second response is asserted; the persisted state is re-read through a separate `get(...)` rather than trusted from the mutating call's own body; and at least one refusal asserts the envelope's `$.error.code` rather than the status alone. Cite one line per clause."

  - name: change-focus
    weight: 15
    # DECISION B, E-001, 2026-08-27: the baseline tree is attached, so "was this restyled"
    # is citable at path:line in BOTH trees. The ticket names `confirm`. Every other method
    # is out of scope, and the imports `confirm` itself requires are not.
    precondition: "No baseline tree among the attachments → score: null, reason: no baseline to read a change against. Never 2."
    anchors:
      0: "Two or more methods the ticket did not name differ from the baseline in anything beyond trailing whitespace — reformatted, restructured, an expression body turned into a block, a local renamed. Name each method and cite the line in both trees."
      1: "Exactly one method the ticket did not name differs from the baseline. Name it and cite both trees."
      2: "Every method the ticket did not name is character-identical to the baseline. Only `confirm`, and the imports it requires, differ. Name the methods checked."
