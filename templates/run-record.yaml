configuration:             # the registered treatment
  instructions: none
  instructionsHash:
  instructionsProvenLoaded: false    # preflight assertion result
  skills: none
  customAgent: none
  hooks: none
  mcp: none

behavior:
  modelCalls:
  toolCalls:
  toolsUsed: []
  filesRead:
  filesChanged: []
  commands: []
  retries:
  approvals:               # permission requests — and whether anyone could answer
  compactions:

efficiency:
  durationMs:
  inputTokens:
  outputTokens:
  cachedInputTokens:
  cacheCreationTokens:
  cost:

evaluation:
  compile:
  tests:
  hiddenTests:
  acceptanceScore:
  unintendedChanges:
  failureClass:            # F01-F15
  finalScore:

measurement:
  status:                  # valid / excluded / pilot / invalidated
  exclusionReason:         # structured, registered in advance
  telemetryComplete:       # a gap must not read as a zero

notes: |
  Anything surprising. Especially anything that made the agent look good —
  five of our seven harness bugs were caught fast because they looked bad;
  the two that survived review were the two that flattered the result.
