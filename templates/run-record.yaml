runId: B0-COPILOT-BE001-001

task:
  id: BE-001
  revision: 1
  benchmarkSha:            # the commit the task/evaluator were resolved from

harness:
  name: github-copilot-cli
  version:
  runnerCommit:

model:
  requested:               # what you asked for, e.g. "haiku"
  resolved:                # what telemetry reports, e.g. "claude-haiku-4-5-20251001"
  # These differing is not a detail. An alias can silently re-point between runs.

environment:               # everything that loaded but was not the treatment
  bare: false              # --bare?
  permissionMode:          # acceptEdits / plan / default — see harness bug #7
  hooks: []
  plugins: []
  skills: []
  mcpServers: []
  settingsSources: []
  fingerprint:             # hash of the above; arms must match

configuration:             # the registered treatment
  instructions: none
  instructionsHash:
  instructionsProvenLoaded: false    # preflight assertion result
  skills: none
  customAgent: none
  hooks: none
  mcp: none

behavior:
  modelCalls:
  toolCalls:
  toolsUsed: []
  filesRead:
  filesChanged: []
  commands: []
  retries:
  approvals:               # permission requests — and whether anyone could answer
  compactions:

efficiency:
  durationMs:              # wall clock. The runner always knows this one.

  # Every usage value carries its own provenance, so a gap reads as a gap and not as a
  # very efficient run. Level A is what the provider reported, B is what a local tokenizer
  # guessed, C is that nobody knows.
  #
  #   { value: 12400, source: provider,        estimated: false }   # Level A
  #   { value: 11950, source: local-tokenizer, estimated: true  }   # Level B
  #   { value: null,  source: null,            estimated: null  }   # Level C
  #
  # A record starts at Level C for everything, because that is true until a run fills it in.
  # `tools/validate-run-record.sh` rejects a bare number — this block is Layer 3 on its own.
  inputTokens:         { value: null, source: null, estimated: null }
  outputTokens:        { value: null, source: null, estimated: null }
  cachedInputTokens:   { value: null, source: null, estimated: null }
  cacheCreationTokens: { value: null, source: null, estimated: null }
  cost:                { value: null, source: null, estimated: null }

evaluation:
  compile:
  tests:
  hiddenTests:
  acceptanceScore:
  unintendedChanges:
  failureClass:            # F01-F15
  finalScore:

measurement:
  status:                  # valid / excluded / pilot / invalidated
  exclusionReason:         # structured, registered in advance
  telemetryComplete:       # a gap must not read as a zero

notes: |
  Anything surprising. Especially anything that made the agent look good —
  five of our seven harness bugs were caught fast because they looked bad;
  the two that survived review were the two that flattered the result.
